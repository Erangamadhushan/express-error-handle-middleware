name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]

body:

* type: textarea
  id: description
  attributes:
  label: Describe the bug
  placeholder: A clear description of the bug

* type: textarea
  id: reproduction
  attributes:
  label: Steps to reproduce

* type: textarea
  id: expected
  attributes:
  label: Expected behavior

* type: input
  id: version
  attributes:
  label: Package version

* type: dropdown
  id: runtime
  attributes:
  label: Runtime
  options:
  - Node.js 18
  - Node.js 20
  - Node.js 22

* type: textarea
  id: additional
  attributes:
  label: Additional information
